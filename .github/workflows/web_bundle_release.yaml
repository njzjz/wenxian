name: Publish web bundle

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-latest-bundle
  cancel-in-progress: true

jobs:
  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
      - name: Build latest wheel
        run: uv build --wheel
      - name: Build prepackaged Pyodide environment from lock
        run: |
          wheel=$(echo dist/wenxian-*.whl)
          python scripts/build_web_bundle.py \
            "$wheel" wenxian-web-packages.tar.gz
      - name: Validate bundle contents
        run: |
          mkdir bundle-check
          tar -xzf wenxian-web-packages.tar.gz -C bundle-check
          PYTHONPATH=bundle-check python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          import pylatexenc
          import requests
          import unidecode
          import wenxian

          manifest = json.loads(
              Path("bundle-check/wenxian-web-manifest.json").read_text()
          )
          assert manifest["format"] == 1
          assert manifest["packages"]["wenxian"] == version("wenxian")
          assert manifest["requirements_lock"] == "web-requirements.lock"
          assert "requests==2.34.2" in manifest["requirements"]
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Publish rolling web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_TAG: web-latest
        run: |
          if ! gh release view "$WEB_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$WEB_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest web bundle" \
              --notes "Rolling Pyodide bundle built from the latest master commit with uv-locked dependencies. This prerelease is updated automatically." \
              --prerelease
          fi
          gh release upload "$WEB_TAG" \
            wenxian-web-packages.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

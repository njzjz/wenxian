name: Publish web bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the web bundle to
        required: true
        type: string

permissions:
  contents: write

jobs:
  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bundle tooling
        uses: actions/checkout@v7
        with:
          ref: master
          path: tooling
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release-src
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build released wheel
        working-directory: release-src
        run: pipx run build --wheel
      - name: Build prepackaged Pyodide environment
        run: |
          wheel=$(echo release-src/dist/wenxian-*.whl)
          python tooling/scripts/build_web_bundle.py \
            "$wheel" wenxian-web-packages.tar.gz
      - name: Validate bundle contents
        run: |
          mkdir bundle-check
          tar -xzf wenxian-web-packages.tar.gz -C bundle-check
          PYTHONPATH=bundle-check python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          import pylatexenc
          import requests
          import unidecode
          import wenxian

          manifest = json.loads(
              Path("bundle-check/wenxian-web-manifest.json").read_text()
          )
          assert manifest["format"] == 1
          assert manifest["packages"]["wenxian"] == version("wenxian")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Attach bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            wenxian-web-packages.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

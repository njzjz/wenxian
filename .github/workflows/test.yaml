name: Test package and web app

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Setup uv
        run: python -m pip install uv
      - name: Install dependencies
        run: python -m uv pip install --system nox[uv]
      - name: Test with pytest
        run: nox -db uv
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: python
          name: python-${{ matrix.python }}

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install web test dependencies
        run: npm install
      - name: Run web unit tests with coverage
        run: npm run test:web
      - name: Upload web coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          flags: web
          name: web
          fail_ci_if_error: true
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end smoke test
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/wenxian-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          npm run test:web:e2e
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-failure
          path: web-e2e-failure.png
          if-no-files-found: ignore

  pass:
    name: Pass testing
    needs: [test, web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

permissions:
  contents: read
  id-token: write

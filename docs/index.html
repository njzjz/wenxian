<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      name="description"
      content="Generate BibTeX from DOI/PMID/arXiv identifier"
    />
    <meta
      name="keywords"
      content="BibTeX, DOI, PMID, arXiv, citation, reference"
    />
    <meta name="author" content="Jinzhe Zeng" />
    <meta name="theme-color" content="#03A89E" />
    <link rel="icon" type="image/svg" href="logo.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://api.semanticscholar.org" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/github-fork-ribbon-css@0.2.3/gh-fork-ribbon.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-solarizedlight.min.css"
    />
    <title>wenxian</title>
  </head>

  <body class="flex">
    <a
      class="github-fork-ribbon"
      href="https://github.com/njzjz/wenxian"
      data-ribbon="Fork me on GitHub"
      title="Fork me on GitHub"
      >Fork me on GitHub</a
    >
    <h1 style="margin-bottom: 50px; color: #03a89e">
      <img
        src="logo.svg"
        height="100"
        width="100"
        style="margin-bottom: -1em"
        alt=""
      />
      wenxian
    </h1>
    <form id="lookup-form" style="padding-bottom: 20px" class="flex">
      <label class="block" style="width: fit-content">
        <span class="visually-hidden">DOI, PMID, or arXiv identifier</span>
        <input
          class="block identifier"
          id="identifier"
          type="text"
          placeholder="DOI, PMID, or arXiv identifier"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          required
        />
        <span class="bar"></span>
      </label>
      <button type="submit" id="submit" class="block btn">
        Generate BibTeX
      </button>
    </form>
    <div class="examples">
      <p><b>Examples:</b></p>
      <ul>
        <li>
          <a href="#identifier" data-identifier="10.1063/5.0155600"
            >10.1063/5.0155600</a
          >
        </li>
        <li>
          <a href="#identifier" data-identifier="37526163">37526163</a>
        </li>
        <li>
          <a href="#identifier" data-identifier="2304.09409">2304.09409</a>
        </li>
      </ul>
    </div>
    <p id="message" class="status" role="status" aria-live="polite"></p>
    <div id="output" class="output" style="display: none">
      <button id="copy_button" type="button" class="copy-button">
        Copy BibTeX
      </button>
      <pre><code class="language-bib" id="bibtex"></code></pre>
    </div>
    <p class="footer">
      Part of
      <a href="https://github.com/njzjz/wenxian">njzjz/wenxian</a>
      · Metadata from
      <a href="https://www.semanticscholar.org/product/api">Semantic Scholar</a>
    </p>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/prismjs-bibtex@2.1.0/prism-bibtex.js"
      integrity="sha256-A5GMUmGHpY8mVpfcaRLQFeHtmdjZLumKBOMpf81FXX0="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="wenxian.js" type="module"></script>
  </body>
</html>
